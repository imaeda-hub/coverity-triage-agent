name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install Subversion (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install sliksvn -y --no-progress
          "C:\Program Files\SlikSvn\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Subversion (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q subversion

      - name: Show tool versions
        run: |
          uv --version
          git --version
          svn --version --quiet

      - name: Check that the lock files match the projects
        run: |
          uv lock --check
          uv lock --check --directory plugins/coverity-triage/server

      - name: Run tests
        run: uv run --python 3.12 pytest -q
